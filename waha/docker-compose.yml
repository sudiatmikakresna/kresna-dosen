services:
  waha:
    image: devlikeapro/waha:gows
    container_name: waha
    restart: unless-stopped
    env_file: .env
    environment:
      WHATSAPP_DEFAULT_ENGINE: GOWS
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./sessions:/app/.sessions

  # Tunnel tetap (butuh domain di Cloudflare). Jalankan: docker compose --profile tunnel up -d
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: waha-tunnel
    restart: unless-stopped
    profiles: [tunnel]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Isi CLOUDFLARE_TUNNEL_TOKEN di waha/.env}
    # Supaya tunnel yang sama juga bisa membuka aplikasi lain di laptop (mis. server bengkel)
    # lewat http://host.docker.internal:<port>. Di Docker Desktop baris ini tidak wajib, di Linux wajib.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: [waha]

  # Tunnel cepat tanpa domain (alamat *.trycloudflare.com berganti tiap restart).
  # Jalankan: docker compose --profile quick up -d, lalu lihat alamatnya: docker compose logs quick-tunnel
  quick-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: waha-quick-tunnel
    restart: unless-stopped
    profiles: [quick]
    command: tunnel --no-autoupdate --url http://waha:3000
    depends_on: [waha]
